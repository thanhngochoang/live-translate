[package]
name = "voicetrans-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
default-run = "voicetrans-desktop"

[[bin]]
name = "voicetrans-desktop"
path = "src/main.rs"

[[bin]]
name = "VoiceTrans-Setup"
path = "src/bin/setup.rs"

[dependencies]
voicetrans-core = { path = "../voicetrans-core" }
bzip2-rs = "0.1"
directories = "5"
eframe = "0.29"
egui = "0.29"
native-tls = "0.2"
ort = { version = "2.0.0-rc.9", default-features = false, features = ["std", "load-dynamic"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
tray-icon = "0.19"
ureq = { version = "2", default-features = false, features = ["native-tls"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target.'cfg(target_os = "windows")'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(not(target_os = "windows"))'.dependencies]
cpal = "0.15"
display-info = "0.5"
